# =============================================================================
# Docker Compose: every service of the project.
#
# Two ways to use it (details in README.md):
#   Development:  docker compose up -d postgres redis mailpit   (+ npm run dev on your PC)
#   Full stack:   docker compose up -d --build                  (everything in containers)
#
# Values like ${POSTGRES_USER} come from the .env file next to this file.
# Ports are bound to 127.0.0.1, so only your own PC can reach them, not your network.
# =============================================================================
name: whc

x-database-url: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

services:
  # ---- PostgreSQL: main database --------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL files here run once, when the data volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [default, scan-net]

  # ---- Redis: job queue (Phase 4), rate limits, live progress ----------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [default, scan-net]

  # ---- Mailpit: catches emails in development. Inbox: http://localhost:8025 ---
  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025' # web inbox
      - '127.0.0.1:1025:1025' # SMTP

  # ---- One-off job: applies database migrations, then exits -------------------
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: build
    command: ['npm', 'run', 'deploy', '-w', '@whc/db']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ---- API (Express) -----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 4000
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      # Auth: the API refuses to start in production with the example secret.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      # Local Docker serves plain http://localhost, so Secure cookies must be off here.
      # Behind real HTTPS, set DOCKER_COOKIE_SECURE=true.
      COOKIE_SECURE: ${DOCKER_COOKIE_SECURE:-false}
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8081}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-Website Health Checker <no-reply@whc.local>}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_USER_HOURLY_LIMIT: ${AI_USER_HOURLY_LIMIT:-20}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-200}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2500}
      STORAGE_DIR: /data/storage
      MAX_ACTIVE_SCANS_PER_USER: ${MAX_ACTIVE_SCANS_PER_USER:-3}
      REQUIRE_DOMAIN_VERIFICATION: ${REQUIRE_DOMAIN_VERIFICATION:-false}
    # The API only READS screenshots written by the scanner.
    volumes:
      - storage:/data/storage:ro
    # No published port: the browser reaches the API through the web container (/api).
    depends_on:
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---- Egress proxy: the ONLY way out to the internet for the scanner (SSRF guard) --
  egress-proxy:
    build:
      context: .
      dockerfile: docker/egress-proxy.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: 3128
      PROXY_ALLOWED_PORTS: ${PROXY_ALLOWED_PORTS:-80,443}
    # On both networks: receives requests on scan-net, sends them out on default.
    networks: [default, scan-net]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3128/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6

  # ---- Scanner worker (Playwright + axe-core) ----------------------------------------
  scanner:
    build:
      context: .
      dockerfile: docker/scanner.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      EGRESS_PROXY_URL: http://egress-proxy:3128
      STORAGE_DIR: /data/storage
      SCANNER_CONCURRENCY: ${SCANNER_CONCURRENCY:-1}
      SCAN_LIGHTHOUSE_ENABLED: ${SCAN_LIGHTHOUSE_ENABLED:-true}
      SCAN_MAX_LIGHTHOUSE_PAGES: ${SCAN_MAX_LIGHTHOUSE_PAGES:-3}
      SCAN_LIGHTHOUSE_TIMEOUT_MS: ${SCAN_LIGHTHOUSE_TIMEOUT_MS:-90000}
      SCAN_VISUAL_PAGES: ${SCAN_VISUAL_PAGES:-3}
      SCAN_RETENTION_DAYS: ${SCAN_RETENTION_DAYS:-0}
      SCAN_MAX_PAGES: ${SCAN_MAX_PAGES:-100}
      SCAN_NAV_TIMEOUT_MS: ${SCAN_NAV_TIMEOUT_MS:-30000}
      SCAN_MAX_DURATION_MS: ${SCAN_MAX_DURATION_MS:-900000}
    volumes:
      - storage:/data/storage
    # ONLY the internal network: no route to the internet except via egress-proxy.
    networks: [scan-net]
    shm_size: 1gb # Chromium needs shared memory for rendering
    mem_limit: 3g
    cpus: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy

  # ---- Web (React build served by nginx; forwards /api to the API) ---------------
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8081}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  default: {}
  # Internal network: containers on it can talk to each other but not to the internet.
  scan-net:
    internal: true

volumes:
  pgdata:
  redisdata:
  storage: # screenshots (written by scanner, read by api)
