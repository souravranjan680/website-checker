# =============================================================================
# Docker Compose: every service of the project.
#
# Two ways to use it (details in README.md):
#   Development:  docker compose up -d postgres redis mailpit   (+ npm run dev on your PC)
#   Full stack:   docker compose up -d --build                  (everything in containers)
#
# Values like ${POSTGRES_USER} come from the .env file next to this file.
# Ports are bound to 127.0.0.1, so only your own PC can reach them, not your network.
# =============================================================================
name: whc

x-database-url: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

services:
  # ---- PostgreSQL: main database --------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL files here run once, when the data volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  # ---- Redis: job queue (Phase 4), rate limits, live progress ----------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- Mailpit: catches emails in development. Inbox: http://localhost:8025 ---
  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025' # web inbox
      - '127.0.0.1:1025:1025' # SMTP

  # ---- One-off job: applies database migrations, then exits -------------------
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: build
    command: ['npm', 'run', 'deploy', '-w', '@whc/db']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ---- API (Express) -----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 4000
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # No published port: the browser reaches the API through the web container (/api).
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---- Web (React build served by nginx; forwards /api to the API) ---------------
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8081}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
  redisdata:
